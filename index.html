<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry Scribe</title>
    <link rel="stylesheet" href="style.css">
    <!-- For PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <header>
        <h1>Ministry Scribe</h1>
    </header>

    <main>
        <!-- This is the main screen showing the list of territories -->
        <div id="territory-list-view" class="view active">
            <h2>My Territories</h2>
            <div class="controls">
                <span>Sort by:</span>
                <button class="sort-btn" data-sort="number">Territory #</button>
                <button class="sort-btn" data-sort="name">Street Name</button>
                <button class="sort-btn" data-sort="date">Date Added</button>
            </div>
            <ul id="territory-list"></ul>
            <button id="add-territory-btn" class="primary-action">+ Add New Territory</button>

            <div class="data-management-section">
                <h3>Data Management</h3>
                <button id="restore-btn">Restore from Backup (.mscribe)</button>
                <input type="file" id="restore-file-input" accept=".mscribe" hidden>
            </div>
        </div>

        <!-- This screen shows the list of houses for a single territory -->
        <div id="house-list-view" class="view">
            <button class="back-btn" data-target="territory-list-view">&larr; Back to Territories</button>
            <h2 id="house-list-title"></h2>
            <ul id="house-list"></ul>
            <button id="add-house-btn" class="primary-action">+ Add New House</button>

            <div class="data-management-section">
                <h3>Export This Territory</h3>
                <button id="export-mscribe-btn">Export Full Backup (.mscribe)</button>
                <button id="export-csv-btn">Export as CSV</button>
                <button id="export-pdf-btn">Export as Printable PDF</button>
            </div>
        </div>

        <!-- This screen shows the details for a single house -->
        <div id="house-detail-view" class="view">
             <button class="back-btn" data-target="house-list-view">&larr; Back to House List</button>
             <h2 id="house-detail-address"></h2>

             <div class="detail-section">
                <h3>Details</h3>
                <label><input type="checkbox" id="mailbox-check"> Mailbox Available</label><br>
                <label><input type="checkbox" id="notrespass-check"> "No Trespassing" Notice</label><br>
                <label><input type="checkbox" id="not-at-home-check"> Currently "Not at Home"</label>
             </div>

             <div class="detail-section">
                <h3>Individuals Met</h3>
                <ul id="people-list">
                    <!-- Names will be dynamically inserted here -->
                </ul>
             </div>

             <div class="detail-section">
                 <h3>Visit History</h3>
                 <ul id="visit-notes-list">
                    <!-- Visit notes will be dynamically inserted here -->
                 </ul>
                 <button id="add-visit-btn" class="primary-action">+ Add New Visit Note</button>
             </div>
        </div>

        <!-- NOTE-TAKING MODAL -->
        <div id="note-modal" class="modal-backdrop hidden">
            <div class="modal-content">
                <button class="close-modal-btn">&times;</button>
                <h3>Add Visit Note</h3>
                <label for="modal-person-name">Person's Name (optional)</label>
                <input type="text" id="modal-person-name">
        
                <label for="modal-visit-notes">Visit Notes</label>
                <textarea id="modal-visit-notes" rows="4"></textarea>
        
                <label class="modal-toggle">
                    <input type="checkbox" id="modal-remove-nh-check">
                    Remove 'NH' Status?
                </label>
        
                <div class="modal-actions">
                    <button id="modal-cancel-btn">Cancel</button>
                    <button id="modal-save-note-btn" class="primary-action">Save Note</button>
                </div>
            </div>
        </div>
        
       <!-- ADD NEW TERRITORY MODAL (ADD THIS ENTIRE BLOCK) -->
        <div id="territory-modal" class="modal-backdrop hidden">
            <div class="modal-content">
                <button class="close-modal-btn">&times;</button>
                <h3>Add New Territory</h3>
                
                <label for="modal-territory-number">Territory Number</label>
                <input type="text" id="modal-territory-number" placeholder="e.g., 5, 1-7, 4-13 LTR">
        
                <label for="modal-territory-name">Street Name</label>
                <input type="text" id="modal-territory-name" placeholder="e.g., Maple Street">
        
                <div class="modal-actions">
                    <button id="modal-territory-cancel-btn">Cancel</button>
                    <button id="modal-territory-save-new-btn">Save & New</button>
                    <button id="modal-territory-save-btn" class="primary-action">Save</button>
                </div>
            </div>
        </div>
        
    </main>

    <!-- App Logic -->
    <script src="database.js"></script>
    <script src="app.js"></script>
</body>
</html>
